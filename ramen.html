    <div class="stat-card accent-dark">

<!-- ── MODAL ── -->
<div class="modal-overlay" id="modal-overlay">

    <div class="modal-photo" id="modal-photo">

    </div>
    <div class="modal-body">
      <div class="modal-name" id="modal-name"></div>

      <div class="modal-section-label">タグ</div>

    </div>
  </div>

<!-- 共通スクリプト(nav濃淡・ハンバーガー・reveal) -->
<script src="script.js"></script>

<script>
  let reviews = [];

  /* ── STATS ── */
  function computeStats() {
    const total  = reviews.reduce((s, r) => s + r.visits, 0);
    const shops  = reviews.length;
    const favs   = reviews.filter(r => r.favorite).length;
    const latest = reviews.reduce((a, b) => a.date > b.date ? a : b);

    animateNum('stat-bowls', total);
    animateNum('stat-shops', shops);
    animateNum('stat-favs', favs);
    document.getElementById('stat-latest').textContent = latest.date;
  }

  function animateNum(id, target, isFloat = false) {
    const el = document.getElementById(id);
    const end = parseFloat(target);
    const dur = 1200;
    const start = performance.now();
    function step(now) {
      const p = Math.min((now - start) / dur, 1);
      const ease = 1 - Math.pow(1 - p, 3);
      const val = isFloat ? (end * ease).toFixed(1) : Math.round(end * ease);
      el.textContent = val;
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  /* ── RENDER CARD ── */
  function renderCard(r, idx) {
    const iconHtml = r.favorite
      ? `<img class="review-photo-icon" src="assets/images/gekiosi.png" alt="激推し">`
      : r.featured
      ? `<img class="review-photo-icon" src="assets/images/osi.png" alt="推し">`
      : '';
    return `
    <div class="review-card" data-id="${r.id}" data-type="${r.type}">
      <div class="review-photo">
        <img class="review-photo-img" src="${r.image}" alt="${r.name}"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="review-photo-fallback">🍜</div>
        <div class="review-photo-overlay"></div>
        <div class="review-photo-badge">${r.type}</div>
        ${iconHtml}
      </div>
      <div class="review-body">
        <div class="review-top">
          <div class="review-name">${r.name}</div>
        </div>
        <div class="review-location">${r.location}</div>
        <div class="review-note">${r.note}</div>
        <div class="review-footer">
          <span class="review-date">${r.date}</span>
          <button class="review-visit-btn">詳細 →</button>
        </div>
      </div>
    </div>`;
  }

  /* ── RENDER FAVORITES ── */
  function renderFavorites() {
    const favs = reviews.filter(r => r.favorite).sort((a,b) => b.visits - a.visits);
    const grid = document.getElementById('fav-grid');
    grid.innerHTML = favs.map((r, i) => `
      <div class="fav-card" data-id="${r.id}" style="cursor:pointer;">
        <div class="fav-rank${i < 3 ? ' top' : ''}">${i+1}</div>
        <img class="fav-img" src="${r.image}" alt="${r.name}"
          onerror="this.style.opacity='0'">
        <div class="fav-info">
          <div class="fav-name">${r.name}</div>
          <div class="fav-loc">${r.location} · ${r.type}</div>
        </div>
      </div>`).join('');
    grid.querySelectorAll('.fav-card').forEach(el => {
      el.addEventListener('click', () => openModal(+el.dataset.id));
    });
  }

  /* ── RENDER REVIEWS ── */
  let currentFilter = 'all';
  let currentSearch = '';

  function renderReviews() {
    const grid = document.getElementById('reviews-grid');
    const filtered = reviews.filter(r => {
      const matchType = currentFilter === 'all' || r.type === currentFilter;
      const matchSearch = r.name.includes(currentSearch) || r.area.includes(currentSearch);
      return matchType && matchSearch;
    });
    if (filtered.length === 0) {
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--gray);">該当するレビューがありません</div>';
      return;
    }
    grid.innerHTML = filtered.map((r, i) => renderCard(r, i)).join('');
    grid.querySelectorAll('.review-card').forEach(el => {
      el.addEventListener('click', () => openModal(+el.dataset.id));
    });
    // entrance animation
    grid.querySelectorAll('.review-card').forEach((el, i) => {
      el.style.opacity = '0';
      el.style.transform = 'translateY(18px)';
      el.style.transition = 'opacity 0.4s ease, transform 0.4s ease, box-shadow 0.25s';
      setTimeout(() => {
        el.style.opacity = '1';
        el.style.transform = 'translateY(0)';
      }, i * 60);
    });
  }

  /* ── MODAL ── */
  function openModal(id) {
    const r = reviews.find(x => x.id === id);
    if (!r) return;
    document.getElementById('modal-photo').style.background =
      `linear-gradient(135deg, var(--beige) 0%, #e8e0d5 100%)`;
    document.getElementById('modal-photo').querySelector('.modal-close') ||
      document.getElementById('modal-photo').insertAdjacentHTML('beforeend',
        '<button class="modal-close" id="modal-close">✕</button>');
    const photoEl = document.getElementById('modal-photo');
    photoEl.innerHTML = `<img class="modal-photo-img" src="${r.image}" alt="${r.name}"
        onerror="this.style.background='var(--beige)'">
      <button class="modal-close" id="modal-close">✕</button>`;
    document.getElementById('modal-name').textContent = r.name;
    document.getElementById('modal-location').textContent = `${r.location} · ${r.type}`;
    document.getElementById('modal-note').textContent = r.note;
    document.getElementById('modal-tags').innerHTML =
      r.tags.map(t => `<span class="modal-tag">${t}</span>`).join('');
    document.getElementById('modal-meta').innerHTML = `
      <div class="modal-meta-item">
        <div class="modal-meta-label">訪問回数</div>
        <div class="modal-meta-val">${r.visits}回</div>
      </div>
      <div class="modal-meta-item">
        <div class="modal-meta-label">エリア</div>
        <div class="modal-meta-val">${r.area}</div>
      </div>
      <div class="modal-meta-item">
        <div class="modal-meta-label">最終訪問</div>
        <div class="modal-meta-val">${r.date}</div>
      </div>`;
    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  });

  /* ── FILTER ── */
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderReviews();
    });
  });

  document.getElementById('search-input').addEventListener('input', e => {
    currentSearch = e.target.value.trim();
    renderReviews();
  });

  /* ── INIT ── */
  fetch('ramen-data.json')
    .then(res => {
      if (!res.ok) throw new Error('ramen-data.json の読み込みに失敗しました');
      return res.json();
    })
    .then(data => {
      reviews = data.map(r => ({ ...r, note: (r.note && r.note !== 'nan') ? r.note : '' }));
      computeStats();
      renderFavorites();
      renderReviews();
    })
    .catch(err => {
      document.getElementById('reviews-grid').innerHTML =
        `<div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--gray);">
          データの読み込みに失敗しました。<br><small>${err.message}</small>
        </div>`;
    });
</script>
</body>
